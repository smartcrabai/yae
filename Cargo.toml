[package]
description = ""
edition = "2024"
license = "MIT"
name = "yae"
repository = "https://github.com/smartcrabai/yae"
version = "0.1.0"

[dependencies]
opentelemetry = { version = "0.33.1", default-features = false, features = [
  "trace",
] }
opentelemetry-otlp = { version = "0.33.1", features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace", "rt-tokio"] }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[workspace.metadata.dist]
allow-dirty = ["ci"]
cargo-dist-version = "0.32.0"
ci = "github"
install-path = "CARGO_HOME"
installers = ["shell", "homebrew"]
publish-jobs = ["homebrew"]
tap = "smartcrabai/homebrew-tap"
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[profile.dist]
inherits = "release"
